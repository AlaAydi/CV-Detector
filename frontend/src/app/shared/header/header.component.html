<header class="app-header" [class.scrolled]="scrolled()">
  <div class="header-inner">
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <span class="logo-mark"></span>
      <span class="logo-text">AI Resume Optimizer</span>
    </a>

    <nav class="nav-links" [class.open]="menuOpen()">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          class="nav-link"
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>
      }

      <div class="nav-actions mobile-only">
        @if (authenticated()) {
          <a routerLink="/dashboard" class="ghost-link" (click)="closeMenu()">Tableau de bord</a>
          <button type="button" class="ghost-button" (click)="logout()">Déconnexion</button>
        } @else {
          <a routerLink="/login" class="ghost-link" (click)="closeMenu()">Se connecter</a>
          <a routerLink="/register" class="cta-link" (click)="closeMenu()">Créer un compte</a>
        }
      </div>
    </nav>

    <div class="nav-actions desktop-only">
      @if (authenticated()) {
        <a routerLink="/dashboard" class="ghost-link">Tableau de bord</a>
        <button type="button" class="ghost-button" (click)="logout()">Déconnexion</button>
      } @else {
        <a routerLink="/login" class="ghost-link">Se connecter</a>
        <a routerLink="/register" class="cta-link">Créer un compte</a>
      }
    </div>

    <button
      type="button"
      class="menu-toggle"
      [class.open]="menuOpen()"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Ouvrir le menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
